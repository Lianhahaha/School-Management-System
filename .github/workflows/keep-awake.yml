name: Keep awake

# Render's free tier puts the API to sleep after 15 minutes without a request. A cron-job.org job (the owner's
# account) calls /api/v1/health every 5 minutes and is what keeps it awake: GitHub starts this frequent schedule
# only every few hours. This workflow stays as an uptime check of the API and the website: when either does not
# answer (or the API reports its database down), the run fails and GitHub emails the repository owner. Run it by
# hand from the Actions tab to check the site at any time.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

permissions: {}

env:
  API_HEALTH_URL: https://skole-api.onrender.com/api/v1/health
  SITE_URL: https://skoleph.web.app/

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API answers and its database is up
        run: |
          # A sleeping API can take a minute to wake: retry before calling it down.
          body=$(curl --silent --show-error --fail --retry 4 --retry-delay 20 --retry-all-errors \
            --max-time 90 "$API_HEALTH_URL")
          echo "$body"
          echo "$body" | jq -e '.data.status == "ok" and .data.db == "up"' > /dev/null

      - name: Website answers
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 10 \
            --max-time 30 "$SITE_URL")
          echo "HTTP $code"
          test "$code" = "200"
