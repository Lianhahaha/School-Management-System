name: Deploy frontend

# Releases the frontend to Firebase Hosting (https://skoleph.web.app) once the backend tests have passed for a
# commit on main, so a commit that fails them never reaches the live site. It can also be started by hand.
# The backend deploys itself: Render watches this repository.
on:
  workflow_run:
    workflows: [Backend tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the tests ran on, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # This workflow follows the backend tests, not the frontend checks, so it runs the frontend tests itself.
      - name: Test
        run: npm test
        working-directory: frontend

      # The VITE_* values are public (they end up in the built JavaScript), so they are repository
      # variables, not secrets. Only the Firebase deploy key is a secret.
      # Without the API address the site would call /api/v1 on Firebase Hosting, which answers every path
      # with index.html, so the build is refused instead of deployed broken.
      - name: Build
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "::error::Repository variable VITE_API_BASE_URL is not set"; exit 1; }
          npm run build
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: school-management-system-b0a2a
          channelId: live
