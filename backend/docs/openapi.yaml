        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        phone:
          $ref: '#/components/schemas/Phone'
    StudentDetails:
      type: object
      properties:
        dateOfBirth:
          allOf:
            - $ref: '#/components/schemas/DateYmd'
          description: Must be a date in the past.
        gender:
          $ref: '#/components/schemas/Gender'
        address:
          type: string
          maxLength: 255
        guardianName:
          $ref: '#/components/schemas/PersonName'
        guardianPhone:
          $ref: '#/components/schemas/Phone'
    RegisterRequest:
      description: Account fields plus the optional student details. There is no `role`; it is always `student`.
