        publishedAt:
          $ref: '#/components/schemas/CreateAnnouncementRequest/properties/publishedAt'
        expiresAt:
          $ref: '#/components/schemas/CreateAnnouncementRequest/properties/expiresAt'
  responses:
    # --- Errors: each response carries the error envelope and the X-Request-Id header ---
    BadRequest:
      description: >-
        Validation failed (`VALIDATION_ERROR`): malformed JSON, invalid parameters or body, a referenced record that
        does not exist, or a business rule on the input.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidBody:
              summary: Request validation failed
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: request validation failed
                  details:
                    issues:
                      - path: body.password
                        message: password must be at least 8 characters
                      - path: body.dateOfBirth
                        message: expected YYYY-MM-DD
            studentsNotEnrolled:
              summary: Business rule on the input
              value:
                success: false
                error:
                  code: VALIDATION_ERROR
                  message: students are not enrolled in this class
                  details:
                    reason: not_enrolled
                    invalidStudentIds: [99]
    Unauthorized:
      description: Missing, malformed, expired or revoked bearer token (`UNAUTHORIZED`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: invalid or expired token
              details:
                reason: auth/id-token-expired
    Forbidden:
      description: >-
        The caller is not allowed to do this. `FORBIDDEN` for role, ownership or scope rules; `USER_NOT_REGISTERED`
        when the token has no school account; `ACCOUNT_DISABLED` for a deactivated account.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            roleNotAllowed:
              summary: Role not allowed
              value:
                success: false
                error:
                  code: FORBIDDEN
                  message: your role is not allowed to perform this action
                  details:
                    reason: role_not_allowed
            notClassSubjectOwner:
              summary: Teacher does not own the lesson
              value:
                success: false
                error:
                  code: FORBIDDEN
                  message: only the assigned teacher can modify this class subject
                  details:
                    reason: not_class_subject_owner
            userNotRegistered:
              summary: Valid token without a school account
              value:
                success: false
                error:
                  code: USER_NOT_REGISTERED
                  message: this account is not registered in the school system; contact an administrator
                  details:
                    firebaseUid: f1R3b4s3Uid
    NotFound:
      description: The record does not exist or is not visible to the caller (`NOT_FOUND`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: student not found
              details:
                resource: student
                id: 999
    Conflict:
      description: >-
        Duplicate value, record still in use, or a business conflict (`CONFLICT`); `details.key`,
        `details.constraint` or `details.reason` tell which.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            duplicateKey:
              summary: Duplicate value
              value:
                success: false
                error:
                  code: CONFLICT
                  message: duplicate value for class_subjects.uq_class_subjects_class_subject
                  details:
                    key: class_subjects.uq_class_subjects_class_subject
            alreadyEnrolled:
              summary: Business conflict
              value:
                success: false
                error:
                  code: CONFLICT
                  message: student already has an active enrollment
                  details:
                    reason: already_enrolled
                    activeEnrollmentId: 87
                    classId: 3
    ScheduleConflict:
      description: The slot overlaps another slot of the same class, teacher or room (`SCHEDULE_CONFLICT`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorEnvelope'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      details:
                        type: object
                        required: [conflicts]
                        properties:
                          conflicts:
                            type: array
                            items:
                              $ref: '#/components/schemas/ScheduleConflictItem'
          example:
            success: false
            error:
              code: SCHEDULE_CONFLICT
              message: schedule overlaps 2 existing schedule(s)
              details:
                conflicts:
                  - type: teacher
                    scheduleId: 40
                    classSubjectId: 18
                    className: Grade 8 - B
                    subjectName: Chemistry
                    dayOfWeek: 1
                    startTime: '08:30'
                    endTime: '09:30'
                    room: B-201
                  - type: room
                    scheduleId: 41
                    classSubjectId: 19
                    className: Grade 9 - A
                    subjectName: Physics
                    dayOfWeek: 1
                    startTime: '07:30'
                    endTime: '08:30'
                    room: b-204
    RateLimited:
      description: Too many registrations from this IP address (`RATE_LIMITED`).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: too many requests, try again later
              details:
                retryAfterSeconds: 540
