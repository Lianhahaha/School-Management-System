        timeZone:
          type: string
          description: School time zone used for today, weekdays and the academic year.
          example: Asia/Manila
        uptimeSeconds:
          type: integer
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    # --- Request bodies (strict: unknown fields are rejected with 400) ---
    AccountFields:
