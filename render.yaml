# Render Blueprint: the API as one free web service. Secrets (sync: false) are entered in the Render
# dashboard, never committed. See "Deploying" in README.md.
services:
  - type: web
    name: skole-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: DOCS_ENABLED
        value: "true"
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: CORS_ORIGINS
        sync: false
